TURNSTILE_SITE_KEY = "0x4AAAAAAFXXgRXhW_UJyaKj"

# Existing namespace "seimos-ideju-centras-contact-rate-limit"
[[kv_namespaces]]
binding = "CONTACT_RATE_LIMITER"
id = "a7019e694d214d55bb436705e4e0dcdf"
